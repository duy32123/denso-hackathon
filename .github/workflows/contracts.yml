name: contracts

on:
  push:
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Fixture phai sinh lai giong het ban da commit
        run: |
          python scripts/build_fixtures.py
          git diff --exit-code data/fixtures
      - name: JSON Schema phai khop models
        run: |
          knowflow-contracts export-json-schema contracts/json-schema
          git diff --exit-code contracts/json-schema
      - run: pytest
