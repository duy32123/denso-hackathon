[project]
name = "knowflow-contracts"
version = "1.0.0"
description = "Hop dong du lieu KnowFlow AI (Schema 1.0.0): models, validator V01-V10, fixtures"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "snowballstemmer>=2.2",
]

[project.scripts]
knowflow-contracts = "knowflow_contracts.cli:main"

[project.optional-dependencies]
retrieval = [
    "google-genai>=2.23,<3",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "Pillow==12.3.0",
]
dev = [
    "pytest>=8",
    "python-dotenv>=1.0",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "Pillow==12.3.0",
]
# Keyframe-evidence hardening (docs/keyframe_capability_audit.md): pinned so the
# extraction/pre-filter environment is reproducible. ffmpeg/ffprobe are system
# binaries, pinned by producer_version in the media inventory instead.
media = [
    "opencv-python==4.13.0.92",
    "numpy==2.3.5",
    "Pillow==12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts/schema/knowflow_contracts", "retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["contracts/schema", "."]
addopts = "-q"
