[project]
name = "knowflow-contracts"
version = "1.0.0"
description = "Hop dong du lieu KnowFlow AI (Schema 1.0.0): models, validator V01-V10, fixtures"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.scripts]
knowflow-contracts = "knowflow_contracts.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts/schema/knowflow_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["contracts/schema"]
addopts = "-q"
